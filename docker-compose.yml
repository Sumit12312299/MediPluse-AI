version: "3.9"
services:
  backend:
    build: { context: ./backend, dockerfile: Dockerfile }
    container_name: medipulse_backend
    ports: ["8000:8000"]
    environment: [DEBUG=True, "SECRET_KEY=${SECRET_KEY}", "GEMINI_API_KEY=${GEMINI_API_KEY}"]
    depends_on: [redis]
  frontend:
    build: { context: ./frontend, dockerfile: Dockerfile }
    container_name: medipulse_frontend
    ports: ["5173:5173"]
    environment: [VITE_API_BASE_URL=http://localhost:8000/api]
    depends_on: [backend]
  redis:
    image: redis:7-alpine
    container_name: medipulse_redis
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
volumes:
  redis_data:
